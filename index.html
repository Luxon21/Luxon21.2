<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxon</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luxon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root{--bg:#0b0b0f;--bg2:#1b0a10;--card:#17171d;--ink:#f5f3f1;--mute:#9a98a3;--line:#2a2a33;--red:#ff3347;--glow:rgba(255,51,71,.35);--on:#fff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}}
:root[data-theme="light"]{--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#vh,#vw,#vn,#vp{display:none}
#vh.on{display:flex;flex:1;align-items:center;justify-content:center;padding:20px}
#vw.on{display:flex;flex-direction:column;flex:1;min-height:0}
#vn.on{display:block;flex:1 0 auto;padding-bottom:110px}
.hwrap{width:100%;max-width:460px;text-align:center}
.hwrap h1{font-size:34px;letter-spacing:-.8px;margin:0}
.hwrap p{color:var(--mute);margin:0 0 28px}
#vw .brand img,#vn .head img{background:#0b0b0f;border-radius:14px;padding:8px 12px}
#vh .logo{display:block;width:100%;max-width:380px;height:auto;margin:0 auto 16px;border-radius:18px;background:#fff;padding:18px 22px;border:1px solid var(--line)}
.hbtn{appearance:none;width:100%;display:flex;align-items:center;gap:16px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:14px;cursor:pointer;transition:transform .08s,border-color .15s}
.hbtn:active{transform:scale(.97);border-color:var(--red)}
.hbtn .e{font-size:40px;line-height:1}
.hbtn b{display:block;font-size:21px}
.hbtn small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.toast.show{opacity:1}
#vw #app{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:12px 16px 16px;min-height:0}
#vw .top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#vw .back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;visibility:hidden}
#vw .back.v{visibility:visible}
#vw .prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#vw .prog i{display:block;height:100%;background:var(--red);box-shadow:0 0 12px var(--glow);transition:width .3s}
#vw .cnt{font-size:13px;color:var(--mute);min-width:36px;text-align:right}
#vw .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--mute);margin:14px 0 6px}
#vw .brand img{height:26px;width:auto;display:block}
#vw .note{margin-top:18px}
#vw .note label{margin:0 0 6px;display:flex;justify-content:space-between}
#vw .note textarea{min-height:76px;resize:vertical}
#vw h1{font-size:30px;line-height:1.1;margin:0 0 4px;letter-spacing:-.6px}
#vw .hint{color:var(--mute);margin:0 0 16px}
#vw .body{flex:1;overflow-y:auto;min-height:0;padding:2px 2px 8px}
#vw .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#vw .tile{appearance:none;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 8px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;cursor:pointer;transition:transform .08s,border-color .15s}
#vw .tile .e{font-size:34px;line-height:1}
#vw .tile:active{transform:scale(.96)}
#vw .tile.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 22px var(--glow)}
#vw .tiles.one{grid-template-columns:1fr}
#vw .tiles.one .tile{flex-direction:row;min-height:70px;justify-content:flex-start;padding:12px 20px;gap:16px;font-size:18px}
#vw .tiles.one .tile .e{font-size:28px}
#vw label{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
#vw input,#vw textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
#vw input:focus,#vw textarea:focus{outline:none;border-color:var(--red)}
#vw .foot{padding-top:10px;display:flex;gap:10px}
#vw .btn{flex:1;appearance:none;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:17px;background:var(--red);color:var(--on);cursor:pointer;box-shadow:0 6px 24px var(--glow);text-align:center;text-decoration:none}
#vw .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
#vw .btn[disabled]{opacity:.4;box-shadow:none}
#vw .pkg{background:linear-gradient(135deg,var(--red),#7a1020);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
#vw .pkg small{opacity:.85;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
#vw .pkg b{display:block;font-size:28px;margin:2px 0}
#vw .sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:12px}
#vw .sum div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between}
#vw .sum div:last-child{border:0}
#vw .sum span{color:var(--mute);flex:none}
#vw .sum b{text-align:right;font-weight:600}
#vn main{max-width:640px;margin:0 auto;padding:12px 16px}
#vn .head{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
#vn .head img{height:30px;width:auto}
#vn .head h1{flex:1;margin:0;font-size:28px;letter-spacing:-.5px}
#vn .icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
#vn input,#vn textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
#vn input:focus,#vn textarea:focus{outline:none;border-color:var(--red)}
#vn .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
#vn .chips::-webkit-scrollbar{display:none}
#vn .chip{flex:none;appearance:none;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
#vn .chip.on{border-color:var(--red);background:var(--red);color:var(--on)}
#vn .card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
#vn .card:active{transform:scale(.99)}
#vn .card.pin{border-color:var(--red)}
#vn .card h3{margin:0 0 4px;font-size:17px;display:flex;gap:8px;justify-content:space-between}
#vn .card p{margin:0;color:var(--mute);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
#vn .meta{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--mute)}
#vn .tag{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:600;color:var(--ink)}
#vn .empty{text-align:center;color:var(--mute);padding:50px 20px}
#vn .empty b{display:block;font-size:40px;margin-bottom:8px}
#vn .fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:var(--on);font-size:34px;line-height:1;cursor:pointer;box-shadow:0 8px 28px var(--glow);z-index:4}
#vn #ed{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(12px + env(safe-area-inset-bottom,0px))}
#vn #ed.open{display:flex}
#vn .ebar{display:flex;gap:10px;align-items:center;margin-bottom:10px}
#vn .ebar .sp{flex:1;color:var(--mute);font-size:13px;text-align:center}
#vn .btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;background:var(--red);color:var(--on);cursor:pointer}
#vn .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
#vn #t{font-size:22px;font-weight:700;margin-bottom:10px}
#vn #b{flex:1;resize:none;margin-top:10px;min-height:0}
#vn .erow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#vn .edit-foot{display:flex;gap:10px;margin-top:10px}
#vn .edit-foot .btn{flex:1}
#vn #menu{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.5);align-items:flex-end}
#vn #menu.open{display:flex}
#vn #menu div{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
#vn #menu small{color:var(--mute);text-align:center}
#vp.on{display:block;flex:1 0 auto;padding-bottom:40px}
#vp main{max-width:640px;margin:0 auto;padding:12px 16px}
#vp .phead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
#vp .phead h2{flex:1;margin:0;font-size:28px;letter-spacing:-.5px;text-transform:none;color:var(--ink)}
#vp .icon{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
#vp .btn{appearance:none;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;background:var(--red);color:var(--on);cursor:pointer}
#vp .btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
#vp .pact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#vp .pact .btn{padding:18px 10px;font-size:17px;box-shadow:0 6px 24px var(--glow)}
#vp .pact .btn.alt{box-shadow:none}
#vp .phint{color:var(--mute);font-size:14px;margin:12px 2px 16px}
#vp .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#vp .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:block}
#vp .pempty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 20px}
#vp .pempty b{display:block;font-size:40px;margin-bottom:8px}
#vp .off{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
#vp #pe,#vp #pv{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(10px + env(safe-area-inset-bottom,0px))}
#vp #pe.open,#vp #pv.open{display:flex}
#vp .pbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#vp .pbar .sp{flex:1}
#vp .pcv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#vp .pcv canvas,#vp .pcv img{max-width:100%;max-height:100%;border-radius:10px;display:block}
#vp .pcv canvas{touch-action:none}
#vp .ptools{padding-top:8px}
#vp .pal{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
#vp .pal::-webkit-scrollbar{display:none}
#vp .em{flex:none;width:66px;appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 2px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
#vp .em span{font-size:26px;line-height:1.1}
#vp .em small{font-size:10px;color:var(--mute)}
#vp .em:active{border-color:var(--red)}
#vp .prow{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
#vp .tb{flex:none;appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;padding:0 12px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
#vp .tb.on{background:var(--red);border-color:var(--red);color:var(--on)}
#vp .tb[disabled]{opacity:.35}
#vp .cols{display:none;gap:6px;align-items:center}
#vp .cols.show{display:flex}
#vp .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
#vp .dot.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--red)}
</style>
</head>

$("tdraw").onclick=function(){mode=mode==="draw"?"move":"draw";if(mode==="draw")sel=-1;draw();ui()};
$("tundo").onclick=function(){strokes.pop();draw()};
$("ttext").onclick=function(){var t=prompt("Tekst op de foto:");if(t&&t.trim())add({k:"t",t:t.trim(),s:1})};
$("tminus").onclick=function(){if(sel>-1){items[sel].s=Math.max(.3,items[sel].s*.85);dirty=true;draw()}};
$("tplus").onclick=function(){if(sel>-1){items[sel].s=Math.min(4,items[sel].s*1.18);dirty=true;draw()}};
$("tdel").onclick=function(){if(sel>-1){items.splice(sel,1);sel=-1;dirty=true;draw();ui()}};
function blob(cb){var s=sel;exporting=true;draw();cv.toBlob(function(b){exporting=false;draw();cb(b)},"image/jpeg",.9)}
function leave(go){if(dirty&&!confirm("Niet-opgeslagen wijzigingen weggooien?"))return;$("pe").classList.remove("open");bg=null;dirty=false;go()}
$("pback").onclick=function(){leave(function(){render()})};
$("phm").onclick=function(){leave(function(){window.show("vh")})};
$("psave").onclick=function(){blob(function(b){put({id:"f"+Date.now(),t:Date.now(),blob:b},function(ok){if(!ok){toast("Opslaan mislukt");return}dirty=false;$("pe").classList.remove("open");bg=null;toast("Opgeslagen");render()})})};
$("pshare").onclick=function(){blob(function(b){share(b,"luxon-foto.jpg")})};
$("pvb").onclick=function(){$("pv").classList.remove("open")};
$("pvh").onclick=function(){$("pv").classList.remove("open");window.show("vh")};
$("pvs").onclick=function(){if(vrec)share(vrec.blob,"luxon-foto.jpg")};
$("pvd").onclick=function(){if(vrec&&confirm("Deze foto verwijderen?")){del(vrec.id,function(){vrec=null;$("pv").classList.remove("open");render()})}};
$("hmp").onclick=function(){window.show("vh")};
$("pcamb").onclick=function(){$("pcam").click()};$("plibb").onclick=function(){$("plib").click()};
["pcam","plib"].forEach(function(i){$(i).onchange=function(e){var f=e.target.files&&e.target.files[0];loadFile(f);e.target.value=""}});
window.photosRender=render;
window.photoCount=function(cb){all(function(L){cb(L.length)})};
})();

function $(i){return document.getElementById(i)}

 try{var o=JSON.parse(localStorage.getItem("luxon-wiz")||"null");st=o&&o.I?o.I:0}catch(e){}
 $("gns").textContent=n?(n+(n===1?" notitie":" notities")):"Alles op één plek";
 if(window.photoCount)window.photoCount(function(c){$("gps").textContent=c?c+(c===1?" foto":" foto’s"):"Stroom, ingang & meer aanwijzen"});
 $("gws").textContent=st>0&&st<7?"Doorgaan met lopende aanvraag":"Tik aan wat de klant wil"}
