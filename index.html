<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luxon</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luxon">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root{--bg:#0b0b0f;--bg2:#1b0a10;--card:#17171d;--ink:#f5f3f1;--mute:#9a98a3;--line:#2a2a33;--red:#ff3347;--glow:rgba(255,51,71,.35);--on:#fff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}}
:root[data-theme="light"]{--bg:#faf8f6;--bg2:#fde8ea;--card:#fff;--ink:#17171d;--mute:#6d6b76;--line:#e4e0dc;--red:#d4202e;--glow:rgba(212,32,46,.25);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;padding:12px 16px 16px;min-height:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;visibility:hidden}
.back.v{visibility:visible}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);box-shadow:0 0 12px var(--glow);transition:width .3s}
.cnt{font-size:13px;color:var(--mute);min-width:36px;text-align:right}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2em;font-size:12px;color:var(--mute);margin:14px 0 6px}
.brand img{height:26px;width:auto;display:block}
.note{margin-top:18px}
.note label{margin:0 0 6px;display:flex;justify-content:space-between}
.note textarea{min-height:76px;resize:vertical}
h1{font-size:30px;line-height:1.1;margin:0 0 4px;letter-spacing:-.6px}
.hint{color:var(--mute);margin:0 0 16px}
.body{flex:1;overflow-y:auto;min-height:0;padding:2px 2px 8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{appearance:none;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 8px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;cursor:pointer;transition:transform .08s,border-color .15s}
.tile .e{font-size:34px;line-height:1}
.tile:active{transform:scale(.96)}
.tile.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 22px var(--glow)}
.tiles.one{grid-template-columns:1fr}
.tiles.one .tile{flex-direction:row;min-height:70px;justify-content:flex-start;padding:12px 20px;gap:16px;font-size:18px}
.tiles.one .tile .e{font-size:28px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
.foot{padding-top:10px;display:flex;gap:10px}
.btn{flex:1;appearance:none;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:17px;background:var(--red);color:var(--on);cursor:pointer;box-shadow:0 6px 24px var(--glow);text-align:center;text-decoration:none}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.4;box-shadow:none}
.pkg{background:linear-gradient(135deg,var(--red),#7a1020);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.pkg small{opacity:.85;text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.pkg b{display:block;font-size:28px;margin:2px 0}
.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:12px}
.sum div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between}
.sum div:last-child{border:0}
.sum span{color:var(--mute);flex:none}
.sum b{text-align:right;font-weight:600}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
</style>
</head>

<script>
var STEPS=[
 {id:"type",title:"Wat voor evenement?",single:true,items:[["Feest","🎉"],["Bruiloft","💍"],["Optreden","🎤"],["Zakelijk","💼"],["Festival","🎪"],["Anders","✨"]]},
 {id:"gasten",title:"Hoeveel gasten?",single:true,list:true,items:[["Tot 50","👥"],["50 – 100","🧑‍🤝‍🧑"],["100 – 250","🏟️"],["250 of meer","🔥"]]},
 {id:"plek",title:"Binnen of buiten?",single:true,list:true,items:[["Binnen","🏠"],["Buiten","🌳"],["Allebei","↔️"]]},
 {id:"licht",title:"Welk licht?",hint:"Tik alles aan wat de klant wil",items:[["Sfeerlicht","🕯️"],["Uplighting","🏛️"],["Moving heads","💡"],["Lichtshow","🌈"],["Lasers","⚡"],["Rook / haze","🌫️"],["Podiumlicht","🎭"],["Strobo","✨"]]},
 {id:"geluid",title:"Welk geluid?",hint:"Tik alles aan wat de klant wil",items:[["Speakers","🔊"],["Subwoofers","🥁"],["Microfoon","🎙️"],["DJ-set","🎧"],["Live band","🎸"],["Achtergrond-muziek","🎶"]]},
 {id:"extra",title:"Nog iets extra’s?",hint:"Optioneel",items:[["Technicus erbij","🧑‍🔧"],["Opbouw & afbouw","🚚"],["Podium","🪜"],["Alleen verhuur","📦"]]},

];

var LBL={type:"Evenement",gasten:"Gasten",plek:"Binnen/buiten",licht:"Licht",geluid:"Geluid",extra:"Extra",klant:"Klantgegevens",end:"Algemeen"};

function pkg(){var n=sel("licht").length+sel("geluid").length,g=sel("gasten")[0]||"";

 if(sel("extra").indexOf("Alleen verhuur")>-1&&n<3)return["Verhuur","Losse apparatuur, door de klant op te halen of te laten bezorgen."];
 if(s>=10)return["Full Show","Complete licht- en geluidsshow met techniek erbij."];
 if(s>=5)return["Plus","Uitgebreide sfeer met meerdere effecten."];
 return["Basis","Compacte set voor een sfeervolle avond."]}
function text(){var L=["*Klantwensen Luxon Events*",""];
 function a(k,v){if(v)L.push(k+": "+v)}
 a("Klant",V.naam);a("Telefoon",V.tel);
 var d=V.datum;if(d){var p=d.split("-");d=p[2]+"-"+p[1]+"-"+p[0]}
 a("Datum",d);a("Locatie",V.loc);
 STEPS.forEach(function(s){if(s.items&&sel(s.id).length)a(LBL[s.id],sel(s.id).join(", "))});

 return L.join("\n")}
function render(){
 var s=STEPS[I],b=$("body"),f=$("foot");b.innerHTML="";f.innerHTML="";

 $("back").classList.toggle("v",I>0);
 if(s.items){var g=document.createElement("div");g.className="tiles"+(s.list?" one":"");
  s.items.forEach(function(it){var t=document.createElement("button");t.type="button";t.className="tile"+(sel(s.id).indexOf(it[0])>-1?" on":"");
   t.innerHTML='<span class="e"></span><span class="l"></span>';t.children[0].textContent=it[1];t.children[1].textContent=it[0];
   t.onclick=function(){var c=sel(s.id).slice(),k=c.indexOf(it[0]);
    if(s.single){A[s.id]=[it[0]];save();setTimeout(function(){go(I+1)},160);render();return}
    if(k>-1)c.splice(k,1);else c.push(it[0]);A[s.id]=c;save();render()};
   g.appendChild(t)});b.appendChild(g);
  var nx=mk(s.single?(sel(s.id).length?"Volgende":"Overslaan"):"Volgende"+(sel(s.id).length?" ("+sel(s.id).length+")":" – overslaan"),"btn",function(){go(I+1)});f.appendChild(nx)}
 else if(s.form){
  [["naam","Naam klant","text"],["tel","Telefoon","tel"],["datum","Datum evenement","date"],["loc","Locatie","text"]].forEach(function(x,i){
   var l=document.createElement("label");l.textContent=x[1];if(!i)l.style.marginTop="0";var inp=document.createElement("input");inp.type=x[2];inp.value=V[x[0]];
   inp.oninput=function(){V[x[0]]=inp.value;save()};b.appendChild(l);b.appendChild(inp)});
    f.appendChild(mk("Bekijk overzicht","btn",function(){go(I+1)}))}
 else if(s.end){var p=pkg();
  var c=document.createElement("div");c.className="pkg";c.innerHTML="<small>Indicatie</small><b></b><span></span>";c.children[1].textContent=p[0];c.children[2].textContent=p[1];b.appendChild(c);
  var m=document.createElement("div");m.className="sum";
  var rows=[["Klant",V.naam],["Telefoon",V.tel],["Datum",V.datum],["Locatie",V.loc]];
  STEPS.forEach(function(x){if(x.items)rows.push([LBL[x.id],sel(x.id).join(", ")])});
  STEPS.forEach(function(x){if((N[x.id]||"").trim())rows.push(["Opm. "+LBL[x.id].toLowerCase(),N[x.id].trim()])});
  rows.forEach(function(r){if(!r[1])return;var d=document.createElement("div"),a=document.createElement("span"),v=document.createElement("b");a.textContent=r[0];v.textContent=r[1];d.appendChild(a);d.appendChild(v);m.appendChild(d)});
  b.appendChild(m);
  var w=document.createElement("a");w.className="btn";w.target="_blank";w.rel="noopener";w.href="https://wa.me/?text="+encodeURIComponent(text());w.textContent="Via WhatsApp";
  f.appendChild(mk("Kopieer","btn alt",function(){var t=text();function fb(){var q=document.createElement("textarea");q.value=t;document.body.appendChild(q);q.select();try{document.execCommand("copy");toast("Gekopieerd")}catch(e){}document.body.removeChild(q)}try{navigator.clipboard.writeText(t).then(function(){toast("Gekopieerd")},fb)}catch(e){fb()}}));
  f.appendChild(w);
  var r=mk("Nieuwe klant","btn alt",function(){if(confirm("Alles wissen en opnieuw beginnen?")){A={};V={naam:"",tel:"",datum:"",loc:""};N={};go(0)}});r.style.flex="none";r.style.padding="16px 14px";f.appendChild(r)}

function noteBox(s){var w=document.createElement("div");w.className="note";
 var l=document.createElement("label");l.textContent=s.end?"Laatste opmerking (optioneel)":"Opmerking (optioneel)";
